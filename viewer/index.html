<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script src="https://unpkg.com/cytoscape-edgehandles@4.0.1/cytoscape-edgehandles.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="toolbar">
  <div class="toolbar-left">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/>
        <line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/>
      </svg>
      <input id="graph-title" class="graph-title-input" value="Skill Tree"
             onblur="changeGraphName(this.value)"
             onkeydown="if(event.key==='Enter'){this.blur()}">
    </div>
  </div>
  <div class="toolbar-center">
    <div class="button-group">
      <button onclick="runLayout('dagre')" class="active" id="btn-dagre" title="Hierarchical layout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><rect x="2" y="18" width="8" height="4" rx="1"/><rect x="14" y="18" width="8" height="4" rx="1"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="12" x2="6" y2="18"/><line x1="12" y1="12" x2="18" y2="18"/></svg>
        Hierarchy
      </button>
      <button onclick="runLayout('cose')" id="btn-cose" title="Force-directed layout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="12" cy="19" r="3"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="6.5" y1="8.5" x2="10.5" y2="16.5"/><line x1="17.5" y1="8.5" x2="13.5" y2="16.5"/></svg>
        Force
      </button>
      <button onclick="runLayout('concentric')" id="btn-concentric" title="Concentric layout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10"/></svg>
        Radial
      </button>
    </div>
  </div>
  <div class="toolbar-right">
    <button onclick="importGraph()" class="ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Import
    </button>
    <button onclick="exportGraph()" class="ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Export
    </button>
    <div class="toolbar-divider"></div>
    <span class="toolbar-label">Colour</span>
    <select id="colour-mode-select" class="toolbar-select" onchange="setColourMode(this.value)">
      <option value="status">Status</option>
    </select>
    <div class="toolbar-divider"></div>
    <span class="toolbar-label">Font</span>
    <button onclick="changeFontSize(-1)" class="ghost" title="Smaller text">A−</button>
    <button onclick="changeFontSize(1)" class="ghost" title="Larger text">A+</button>
    <div class="toolbar-divider"></div>
    <button onclick="showAddNodeModal()" class="primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Node
    </button>
  </div>
</header>

<main id="main">
  <div id="cy"></div>
  <div id="canvas-hint" class="canvas-hint">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
      <circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
      <circle cx="18" cy="6" r="3" stroke-dasharray="2 2"/>
    </svg>
    <span>Double-click to add a node</span>
    <span class="canvas-hint-sub">Shift + drag between nodes to connect them</span>
  </div>
  <div id="edge-mode-badge" class="edge-mode-badge">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/><line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    <span>Edge Mode</span>
  </div>
  <div id="canvas-legend">
    <div class="canvas-legend-title">Legend</div>
    <div class="canvas-legend-items" id="canvas-legend-items"></div>
    <div class="canvas-legend-divider"></div>
    <div class="canvas-legend-arrow">
      <svg width="24" height="10" viewBox="0 0 24 10"><line x1="0" y1="5" x2="18" y2="5" stroke="var(--text-secondary)" stroke-width="1.5"/><polygon points="18,2 24,5 18,8" fill="var(--text-secondary)"/></svg>
      <span>unlocks / leads to</span>
    </div>
    <div class="canvas-legend-frontier">
      <div class="canvas-legend-frontier-box"></div>
      <span>Ready to learn (frontier)</span>
    </div>
  </div>
  <aside id="panel" class="collapsed">
    <div class="panel-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
        <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
      <span>Select a node</span>
    </div>
    <div class="panel-content" id="panel-content"></div>
  </aside>
</main>

<footer id="legend">
  <div class="legend-items" id="legend-items"></div>
  <div class="legend-stats" id="legend-stats"></div>
</footer>

<!-- Add Node Modal -->
<div class="modal-overlay" id="add-node-modal">
  <div class="modal">
    <h3>Add Node</h3>
    <label for="new-node-name">Name</label>
    <input type="text" id="new-node-name" placeholder="Human Readable Name"
           oninput="autoGenerateId(this.value)">
    <label for="new-node-id" class="label-secondary">ID</label>
    <input type="text" id="new-node-id" placeholder="auto-generated-from-name">
    <label for="new-node-desc">Description</label>
    <textarea id="new-node-desc" placeholder="What this skill means..."></textarea>
    <label for="new-node-prereqs">Prerequisites</label>
    <input type="text" id="new-node-prereqs" placeholder="comma-separated IDs">
    <div class="modal-actions">
      <button class="ghost" onclick="hideAddNodeModal()">Cancel</button>
      <button class="primary" onclick="addNode()">Add Node</button>
    </div>
  </div>
</div>

<!-- Edit Status Modal -->
<div class="modal-overlay" id="edit-status-modal">
  <div class="modal modal-sm">
    <h3>Update Status</h3>
    <p class="modal-subtitle" id="status-node-name"></p>
    <div class="status-options" id="status-options"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="hideEditStatusModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- New Graph Modal -->
<div class="modal-overlay" id="new-graph-modal">
  <div class="modal modal-sm">
    <h3>New Graph</h3>
    <label for="new-graph-name">Name</label>
    <input type="text" id="new-graph-name" placeholder="My Graph">
    <label for="new-graph-path">File path (for saving)</label>
    <input type="text" id="new-graph-path" placeholder="graphs/my-graph.json">
    <div class="modal-actions">
      <button class="ghost" onclick="hideNewGraphModal()">Cancel</button>
      <button class="primary" onclick="createNewGraph()">Create</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".json" style="display:none">

<script src="graph-data.js"></script>
<script src="graph-render.js"></script>
<script src="panel.js"></script>
<script src="modals.js"></script>
<script src="app.js"></script>
</body>
</html>
